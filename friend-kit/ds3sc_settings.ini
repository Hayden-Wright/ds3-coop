; ============================================================
;  DS3 Co-op — настройки для ВТОРОГО игрока
;  Файл кладётся сюда:  ...\DARK SOULS III\Game\SeamlessCoop\
;  Имя файла должно остаться: ds3sc_settings.ini
;  Подробная инструкция: README.md рядом с этим файлом
; ============================================================

[GAMEPLAY]

; Захватчики-игроки. 0 = выключить (спокойнее, если играете только вдвоём)
allow_invaders = 1

; Проклятия при смерти (Rot Essence). 0 = выключить
death_debuffs = 1

; Что показывать над игроками: 0 нет | 1 нет | 2 пинг | 3 уровень | 4 смерти | 5 уровень+пинг
overhead_player_display = 2

; Пропуск заставок при запуске
skip_intros = 1

; ВАЖНО: прогресс, пройденный в мире хоста, сохраняется и вам (гостю)
sync_progress_as_guest = 1

game_boot_volume = 5


[SCALING]

enemy_health_scaling = 35
enemy_damage_scaling = 0
enemy_posture_scaling = 15
boss_health_scaling = 100
boss_damage_scaling = 0
boss_posture_scaling = 20


[PASSWORD]

; ПАРОЛЬ СЕССИИ — должен совпадать у обоих игроков БУКВА В БУКВУ
; Текущий пароль нашей группы: 123321
cooppassword = 123321


[SAVE]

; Расширение файла сохранения мода. НЕ МЕНЯТЬ: должно быть co2
; Благодаря этому ваши обычные сохранения DS3 остаются нетронутыми
save_file_extension = co2


[LANGUAGE]

; Пусто = язык берётся из настроек игры
; russian = принудительно русский (файл locale/russian.json)
mod_language_override =
